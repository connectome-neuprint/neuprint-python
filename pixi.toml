[workspace]
authors = ["FlyEM"]
channels = ["conda-forge"]
description = "Python client utilties for interacting with the neuPrint connectome analysis service"
name = "neuprint-python"
platforms = ["osx-64", "linux-64", "win-64", "osx-arm64"]
preview = ["pixi-build"]

# The [package] section allows neuprint-python to be used as a pixi source dependency, e.g.
#
#   [dependencies]
#   neuprint-python = { path = "/path/to/neuprint-python" }
#
# The run-dependencies are generated from dependencies.txt (which the conda recipe uses);
# keep them in sync.
[package]
name = "neuprint-python"
version = "0.6.4"

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[package.build.config]
noarch = true
# The default installer (uv) crashes on rattler-build's placeholder prefix; pip works.
installer = "pip"

[package.host-dependencies]
python = ">=3.9"
setuptools = "*"
pip = "*"

[package.run-dependencies]
python = ">=3.9"
requests = ">=2.22"
pandas = "*"
tqdm = "*"
ujson = "*"
asciitree = "*"
scipy = "*"
networkx = "*"
packaging = "*"
pyarrow = "*"

[environments]
test = ["test"]
docs = ["docs"]
dev = ["docs", "test", "dev"]
publish = ["publish", "test"]

[feature.test.tasks]
test = "pytest"

[feature.docs.tasks]
make-docs = {cwd = "docs", cmd = "export PYTHONPATH=$PIXI_PROJECT_ROOT && make html"}

[feature.publish.tasks]
upload-to-pypi = "upload-to-pypi.sh"

[dependencies]  # short for [feature.default.dependencies]
requests = ">=2.22"
pandas = ">=2.2.3,<3"
tqdm = ">=4.67.1,<5"
ujson = ">=5.10.0,<6"
asciitree = ">=0.3.3,<0.4"
scipy = ">=1.14.1,<2"
networkx = ">=3.4.2,<4"
packaging = ">=23.0"

[feature.test.dependencies]
pytest = "*"
pyarrow = "*"

[feature.publish.dependencies]
conda-build = "*"
anaconda-client = "*"
twine = "*"
setuptools = "*"

[feature.docs.dependencies]
nbsphinx = "*"
numpydoc = "*"
sphinx_bootstrap_theme = "*"
sphinx = "*"
sphinx_rtd_theme = "*"
ipython = "*"
jupyter = "*"
ipywidgets = "*"
bokeh = "*"
holoviews = "*"
hvplot = "*"
selenium = "*"
phantomjs = "*"

[feature.dev.dependencies]
line_profiler = "*"
pyarrow = "*"
